<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinmap 게시물 분석</title><link rel="stylesheet" href="/style.css"></head><body><main><header><h1>Pinmap 게시물 분석</h1><p>내 게시물을 가져오고 사진·영상을 AI로 분석합니다.</p><button id="logout" hidden>로그아웃</button></header><section id="auth"><h2>로그인</h2><form id="login"><label>이메일<input name="email" type="email" autocomplete="email" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form><details><summary>초대 코드로 계정 만들기</summary><form id="register"><label>이메일<input name="email" type="email" autocomplete="email" required></label><label>비밀번호 (12자 이상)<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label>초대 코드<input name="invite_code" required></label><button>계정 만들기</button></form></details></section><section id="workspace" hidden><div class="two"><section><h2>Instagram 자료 가져오기</h2><p>내보내기 ZIP에서 링크·캡션을 가져옵니다. 원본 사진과 영상은 ZIP에 없을 수 있습니다.</p><form id="import"><input name="file" type="file" accept=".zip" required><button>ZIP 가져오기</button></form></section><section><h2>게시물 링크 추가</h2><form id="add"><label>Instagram 게시물 URL<input name="source_url" type="url" required></label><label>작성자 캡션<textarea name="caption"></textarea></label><button>추가</button></form></section></div><section><h2>내 게시물 <span id="count"></span></h2><div id="posts"></div><button id="more">더 보기</button></section><section><h2>내 AI 작업</h2><div id="jobs"></div></section></section><p id="notice" role="status"></p></main><script type="module" src="/app.js"></script></body></html>
